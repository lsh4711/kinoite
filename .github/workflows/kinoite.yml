name: kinoite

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    outputs:
      build: ${{ steps.check.outputs.build }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - id: check
        run: |
          MAYBE_OLD_VERSION=$(docker manifest inspect ghcr.io/lsh4711/kinoite --verbose 2>&1) || EXIT_CODE=$?
          ALLOW_ERROR='Get "https://ghcr.io/v2/lsh4711/kinoite/manifests/latest": denied'

          if [ -n "${EXIT_CODE}" ]; then
            if [ "${MAYBE_OLD_VERSION}" != "${ALLOW_ERROR}" ]; then
              exit 1
            fi

            OLD_VERSION=init
          elif [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            OLD_VERSION=push
          else
            OLD_VERSION=$(echo "${MAYBE_OLD_VERSION}" | jq '.SchemaV2Manifest.annotations["org.opencontainers.image.version"]' --raw-output --exit-status)
          fi

          NEW_VERSION=$(docker manifest inspect quay.io/fedora/fedora-kinoite:43 --verbose | jq '.[0].OCIManifest.annotations["org.opencontainers.image.version"]' --raw-output --exit-status)

          echo "OLD: ${OLD_VERSION}"
          echo "NEW: ${NEW_VERSION}"
          echo "version=${NEW_VERSION}" >> ${GITHUB_OUTPUT}

          if [ "${OLD_VERSION}" != "${NEW_VERSION}" ]; then
            echo "build=true" >> ${GITHUB_OUTPUT}
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true' && needs.check.outputs.version != ''
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    env:
      REGISTRY: ghcr.io
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            value=${{ needs.check.outputs.version }}
            value={{date 'YYYYMMDD' tz='Asia/Seoul'}}
            value={{date 'YYYYMMDD-HHmmss' tz='Asia/Seoul'}}
            latest

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
